---
site_name: ready
site_description: Documentation website for READY
site_author: READY Authors
copyright: Copyright © 2026 READY Authors
repo_url: https://github.com/oocular/ready/
repo_name: oocular/ready
edit_uri: edit/main/docs/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

theme:
  name: material
  features:
    - content.action.edit
  palette:
    - media: (prefers-color-scheme)
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: getting-started/README.md
  - Getting Started:
    - Installation: getting-started/installation.md
  - Cricket:
    - Instructions: cricket/README.md
  - Demos:
    - Demos: demos/README.md
  - Hackathons:
    - Overview: hackathons/README.md
    - Hawkes2024: hackathons/hawkes2024/README.md
  - Holoscan:
    - Overview: holoscan/README.md
    - APIs ready: holoscan/apis_ready.md
    - APIs webrtc_ready: holoscan/apis_webrtc_ready.md
    - APIs webrtc: holoscan/apis_webrtc.md
    - APIs: holoscan/apis.md
  - Models:
    - Models: models/README.md
  - Pose Mobile Human:
    - Pose Mobile Human: pose-mobile-human/README.md

markdown_extensions:
  - pymdownx.tasklist

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: google
            show_submodules: true
          paths:
            - src
  - include-markdown:
      opening_tag: "{!"
      closing_tag: "!}"
