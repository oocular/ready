[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ready"
dynamic = ["version", "readme"]
requires-python = ">=3.12" #python=3.12 local  #python3.10 apptainer
keywords = ["AI"]
authors = [
  {name = "Miguel Xochicale", email = "add@email.com"},
  {name = "Add co-author", email = "add@email.com"},
]
maintainers = [
  {name = "Add maintener", email = "add@email.com"}
]
description = "Package example!"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
dependencies = [
    "numpy==2.3.3",
    "matplotlib==3.10.6",
    "pandas==2.3.2",
    "PyQt6==6.9.1",
    "loguru==0.7.3",
    "omegaconf==2.3.0",
    "scikit-learn==1.7.2",
    "pydot==4.0.1",
]
[project.optional-dependencies]
# development dependency groups
test = [
    "pytest==8.4.2",
    "pylint==3.3.8",
    "black==25.1.0",
    "isort==6.0.1",
    "codespell==2.4.1",
    "pre-commit==4.3.0"
]
learning = [
    "torch==2.8.0", #cricket PyTorch Version 2.3.0a0+6ddf5cf
    "torchvision==0.23.0",
]
model_optimisation = [
    "onnx==1.19.0", #1.16.2  local
    "onnxruntime==1.22.1",#1.19.2 local
    "onnxsim==0.4.36",#0.4.36 local
]

[tool.setuptools.dynamic]
version = {attr = "ready.__version__"}
readme = {file = ["README.md"]}

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["ready"]  # package names should match these glob patterns (["*"] by default)
#exclude = ["my_package.tests*"]  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)
